name: validate softplus tail
on:
  pull_request:
    paths: ['.github/workflows/softplus-validate.yml', '.github/softplus-edit.py', 'src/compile/softplus.rs', 'tests/softplus_tail.rs']
permissions:
  contents: read
jobs:
  validate:
    if: github.head_ref == 'fix/softplus-negative-tail' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          mkdir -p target/softplus-validation
      - name: Reproduce negative-tail failure
        run: |
          result=0
          cargo +1.92.0 test --test regression softplus_tail --locked -- --nocapture --test-threads=1 > target/softplus-validation/before.log 2>&1 || result=$?
          test "$result" = 101
          grep -q 'softplus forward:' target/softplus-validation/before.log
          grep -q 'normalized weight:' target/softplus-validation/before.log
      - name: Apply and validate corrected lowering
        run: |
          python3 .github/softplus-edit.py
          cargo +1.92.0 fmt --all
          cargo +1.92.0 test --test regression softplus_tail --locked -- --nocapture --test-threads=1 2>&1 | tee target/softplus-validation/after.log
          cargo +1.92.0 test --test regression schedule_pointwise --locked -- --nocapture --test-threads=1 2>&1 | tee target/softplus-validation/pointwise.log
          cargo +1.92.0 check --all-targets --all-features --locked
          cargo +1.92.0 clippy --all-targets --all-features --locked -- -D warnings
      - name: Commit tested source on this branch
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/fix/softplus-negative-tail | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/softplus-edit.py
          git add src/compile.rs src/compile/softplus.rs tests/softplus_tail.rs tests/schedule_pointwise.rs tests/regression.rs
          git diff --cached --check
          git commit -m 'fix: preserve softplus negative-tail values and gradients'
          git push origin HEAD:refs/heads/fix/softplus-negative-tail
          git rev-parse HEAD > target/softplus-validation/source-sha.txt
      - name: Preserve validation
        if: always()
        run: tar --exclude=.git --exclude=target/debug --exclude=target/release -czf "$RUNNER_TEMP/softplus-validation.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: softplus-validation
          path: ${{ runner.temp }}/softplus-validation.tar.gz
          retention-days: 7
