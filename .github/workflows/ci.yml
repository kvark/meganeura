name: CI
on:
  push:
    branches: ["main", "claude/*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check every target
        run: cargo check --all-targets --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Frozen paper evidence (CPU only)
        run: |
          python3 -m unittest discover -s paper/p3hpc/artifact -p 'test_*.py'
          python3 paper/p3hpc/artifact/verify.py --repository

      - name: Tuning experiment record replay (CPU only)
        run: |
          cargo test --test tuning_evidence --test holdout_evidence --test crossover_evidence --test readback_evidence --test staging_reuse_evidence --test training_profile_evidence --test conv_tuning_evidence
          cargo test --example tune_holdouts
          cargo test --example tune_crossover
          cargo test --example tune_readback
          cargo test --example tune_staging_reuse
          cargo test --example profile_training

      - name: Package verification
        run: cargo package

  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (lavapipe)
            os: ubuntu-latest
            skip_backprop: "1"
          - name: macOS (Metal)
            os: macos-latest
            skip_backprop: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install lavapipe and Vulkan
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan-dev
          vulkaninfo --summary 2>&1 | head -30

      - uses: Swatinem/rust-cache@v2

      # Every target, not a hand-picked subset: the whole suite
      # is ~2 min on lavapipe, and naming targets one by one meant new test
      # files silently never ran. `--tests` covers the lib unit tests too.
      # Among the coverage this restores:
      # gradcheck (backward ops must chain grad_output — see the contract
      # comment atop autodiff.rs's match block), gpu_smoke, cache_inference,
      # the matmul/attention audit regressions, and the vision ops.
      #
      # --test-threads=1 because several targets drive one adapter and the
      # audit regressions were already serial.
      #
      # `MEGANEURA_SKIP_BIT_EXACT` gates one class of test: exact equality
      # between a fused path and its explicit expansion. The contract holds
      # on the author's hardware and breaks by a last ULP wherever the
      # adapter reassociates the accumulation — lavapipe on two reduction
      # cases, Metal on two others. Gating the class beats naming cases one
      # at a time, which grew with every adapter; `tests/schedule_*.rs`
      # still run these at full strength locally.
      - name: Unit + integration tests
        run: cargo test --tests -- --test-threads=1
        env:
          # MHA backward shaders produce numerically unstable gradients on
          # lavapipe and on CI Metal runners (grad_k divergence on M-series).
          MEGANEURA_SKIP_BACKPROP: ${{ matrix.skip_backprop }}
          MEGANEURA_SKIP_BIT_EXACT: "1"

      - name: Latency benchmark
        if: runner.os == 'Linux'
        run: |
          mkdir -p bench/results
          cargo run --release --example bench_ci_latency > bench/results/ci_latency.json 2>/dev/null
          cat bench/results/ci_latency.json
          python3 bench/check_latency.py bench/results/ci_latency.json

  windows:
    name: Windows compile (Vulkan)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib --tests

  msrv:
    name: Rust 1.92 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit latest compatible resolution
        run: |
          cargo generate-lockfile
          cargo audit
