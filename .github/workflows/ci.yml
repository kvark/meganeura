name: CI
on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check every target, no features
        run: cargo check --all-targets

      - name: Check every target, all features
        run: cargo check --all-targets --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Frozen paper evidence (CPU only)
        run: |
          python3 -m unittest discover -s paper/p3hpc/artifact -p 'test_*.py'
          python3 paper/p3hpc/artifact/verify.py --repository

      # Full verification substitutes crates.io dependencies for the pinned
      # git revision. Re-enable it after Blade publishes calibrated timings.
      - name: Package assembly
        run: cargo package --no-verify --locked --all-features

  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (lavapipe)
            os: ubuntu-latest
            skip_backprop: "1"
          - name: macOS (Metal)
            os: macos-latest
            skip_backprop: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install coverage tool
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install lavapipe and Vulkan
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan-dev
          vulkaninfo --summary 2>&1 | head -30

      - uses: Swatinem/rust-cache@v2

      # One run of the shared suites. Linux instruments that run; it is not a
      # second copy of the suite.
      #
      # Nothing is a default feature. The quality job `cargo check`s the bare
      # build a pinning embedder compiles. Execution is all-features on every
      # OS: `gguf` / `models` / `hub` add tests, and the core tests do not
      # change under those features, so Linux does not run the suite twice.
      #
      # `--test-threads=4` overrides `.cargo/config.toml`, which keeps a
      # workstation at one thread. A hosted runner can keep four sessions
      # in flight: most of a test is graph setup and waiting on the queue.
      # Libtest would otherwise use one thread per CPU.
      #
      # `MEGANEURA_SKIP_BIT_EXACT` gates one class of test: exact equality
      # between a fused path and its explicit expansion. The contract holds
      # on the author's hardware and breaks by a last ULP wherever the
      # adapter reassociates the accumulation — lavapipe on two reduction
      # cases, Metal on two others. Gating the class beats naming cases one
      # at a time, which grew with every adapter; `tests/schedule_*.rs`
      # still run these at full strength locally.
      - name: Unit + integration tests, all features
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            cargo llvm-cov clean --workspace
            cargo llvm-cov --tests --all-features --no-report -- --test-threads=4
          else
            cargo test --tests --all-features -- --test-threads=4
          fi
        env:
          # MHA backward shaders produce numerically unstable gradients on
          # lavapipe and on CI Metal runners (grad_k divergence on M-series).
          MEGANEURA_SKIP_BACKPROP: ${{ matrix.skip_backprop }}
          MEGANEURA_SKIP_BIT_EXACT: "1"

      - name: Rust host coverage
        if: runner.os == 'Linux'
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov report --ignore-filename-regex '(^|/)(tests|examples|bench)/' \
            --json --summary-only --output-path target/llvm-cov/summary.json
          cargo llvm-cov report --ignore-filename-regex '(^|/)(tests|examples|bench)/' \
            --html
          jq -r '.data[0].totals | "Rust host coverage: lines \(.lines.percent)%, functions \(.functions.percent)%, regions \(.regions.percent)%. WGSL execution is not instrumented; CI backprop/bit-exact skips apply."' \
            target/llvm-cov/summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Retain coverage by revision
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-${{ github.sha }}
          path: target/llvm-cov/
          retention-days: 30

      - name: Latency benchmark
        if: runner.os == 'Linux'
        run: |
          mkdir -p bench/results
          cargo run --release --example bench_ci_latency > bench/results/ci_latency.json 2>/dev/null
          cat bench/results/ci_latency.json
          python3 bench/check_latency.py bench/results/ci_latency.json

  windows:
    name: Windows compile (Vulkan)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Windows has no GPU runner; check goes straight to all features.
      - run: cargo check --lib --tests --all-features

  msrv:
    name: Rust MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib --all-features

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit latest compatible resolution
        run: |
          cargo generate-lockfile
          cargo audit
