name: finish Winograd checkpoint lint
on:
  pull_request:
    paths: ['.github/workflows/winograd-style.yml']
permissions:
  contents: read
jobs:
  fix:
    if: github.event.pull_request.number == 160 && github.head_ref == 'fix/shared-winograd-checkpoints' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/runtime/checkpoint.rs');s=p.read_text()
          s=s.replace('.filter_map(|(buffer, _, transform)| {', '.filter_map(|&(buffer, _, ref transform)| {')
          s=s.replace('Winograd3x3 { .. }).then_some(*buffer)', 'Winograd3x3 { .. }).then_some(buffer)')
          s=s.replace('.filter(|(_, buffer)| !caches.contains(buffer))', '.filter(|&&(_, buffer)| !caches.contains(&buffer))')
          p.write_text(s)
          PY
          cargo fmt --all
          cargo clippy --all-targets --all-features -- -D warnings
      - name: Commit lint-only adjustment
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/fix/shared-winograd-checkpoints | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/runtime/checkpoint.rs
          git diff --cached --check
          git commit -m 'style: make checkpoint cache reference patterns explicit'
          git push origin HEAD:refs/heads/fix/shared-winograd-checkpoints
