<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 438 390" role="img" aria-label="Inference time on Apple M3, log scale, milliseconds per forward pass, grouped by model with one bar per framework." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Inference time on Apple M3 by framework and workload</title>
<desc>Grouped bar chart, log scale, milliseconds per forward pass. Dashed placeholders mark framework/model combinations that did not produce a successful result.</desc>
<rect width="438" height="390" fill="#ffffff"/>
<text x="32" y="32" font-size="16" font-weight="500" fill="#111">Inference time, Apple M3 — lower is better</text>
<text x="32" y="54" font-size="13" fill="#6b635a">Milliseconds per forward pass, log scale.</text>
<g transform="translate(32, 74)" font-size="12" fill="#6b635a">
<rect x="0" y="0" width="10" height="10" rx="2" fill="#ee4c2c"/>
<text x="16" y="9">pytorch</text>
<rect x="83" y="0" width="10" height="10" rx="2" fill="#2ecc71"/>
<text x="99" y="9">meganeura</text>
</g>
<g stroke="#e5e0d4" stroke-width="1">
<line x1="84" y1="340.0" x2="406" y2="340.0"/>
<line x1="84" y1="282.5" x2="406" y2="282.5" opacity="0.55"/>
<line x1="84" y1="225.0" x2="406" y2="225.0"/>
<line x1="84" y1="167.5" x2="406" y2="167.5" opacity="0.55"/>
<line x1="84" y1="110.0" x2="406" y2="110.0"/>
</g>
<g font-size="11" fill="#6b635a" text-anchor="end">
<text x="76" y="344.0">1 ms</text>
<text x="76" y="286.5">3</text>
<text x="76" y="229.0">10 ms</text>
<text x="76" y="171.5">32</text>
<text x="76" y="114.0">100 ms</text>
</g>
<line x1="84" y1="110" x2="84" y2="340" stroke="#b4b2a9" stroke-width="1"/>
