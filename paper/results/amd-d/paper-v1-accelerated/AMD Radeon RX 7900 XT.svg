<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 438 390" role="img" aria-label="Inference time on AMD Radeon RX 7900 XT, log scale, milliseconds per forward pass, grouped by model with one bar per framework." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
