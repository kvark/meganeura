[package]
name = "meganeura"
version = "0.2.0"
authors = ["Dzmitry Malyshau"]
repository = "https://github.com/kvark/meganeura"
categories = ["science"]
edition = "2024"
rust-version = "1.88"
description = "E-graph optimized neural network training on Blade"
license = "MIT"

[dependencies]
blade-graphics = { version = "0.8.4", git = "https://github.com/kvark/blade", rev = "f724f6a9da89939de908ec434e65e86a9a789477" }
blade-macros = "0.3"
egglog = "2.0"
bytemuck = { version = "1", features = ["derive"] }
# Pinned to the same wgpu/naga rev as blade-graphics so the `naga::Module`
# we build unifies with the one blade's SPIR-V backend consumes. This rev
# carries `spv::Options::emit_int_div_checks`, which blade sets to false.
naga = { version = "29.0.0", git = "https://github.com/gfx-rs/wgpu", rev = "78b4dfd0cb1ef5ed208fefe80ae2f855db3609bb", features = ["wgsl-in", "wgsl-out", "spv-out"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
log = "0.4"
env_logger = "0.11"
flate2 = "1"
safetensors = "0.4"
hf-hub = { version = "0.4", default-features = false, features = ["ureq", "rustls-tls"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
oxionnx-core = "0.1"
oxionnx-proto = "0.1"
half = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }

[[example]]
name = "mnist"
path = "examples/mnist.rs"

[[example]]
name = "external_buffer"
path = "examples/external_buffer.rs"

[[example]]
name = "diffusion"
path = "examples/diffusion.rs"

