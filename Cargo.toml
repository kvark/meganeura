[package]
name = "meganeura"
version = "0.2.0"
authors = ["Dzmitry Malyshau"]
repository = "https://github.com/kvark/meganeura"
categories = ["science"]
edition = "2024"
rust-version = "1.88"
description = "E-graph optimized neural network training on Blade"
license = "MIT"

[features]
default = []
# Downloading weights from the HuggingFace Hub
# (`SafeTensorsModel::download` / `download_file`). Off by default so
# embedders (Android, iOS, hermetic CI) do not pull ureq/rustls or write
# `~/.cache/huggingface`. Those targets ship weights as assets and load
# them through `SafeTensorsModel::from_bytes` or `::load`.
hub = ["dep:hf-hub"]
# Installs a tracing subscriber in `profiler::init` for Perfetto CPU
# spans. GPU timestamp recording does not need this feature.
profiler = ["dep:tracing-subscriber"]

[dependencies]
blade-graphics = { version = "0.8.4", git = "https://github.com/kvark/blade", rev = "3d01645c1f83083ad863f11d0d3571cdf004e149" }
blade-macros = { version = "0.3", git = "https://github.com/kvark/blade", rev = "3d01645c1f83083ad863f11d0d3571cdf004e149" }
# `default-features = false` drops egglog's `bin` stack (clap, mimalloc,
# env_logger, chrono, graphviz). Greedy mode never constructs an EGraph
# but the crate is still linked for the optional equality-saturation
# modes.
egglog = { version = "2.0", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
# Pinned to the same wgpu/naga rev as blade-graphics so the `naga::Module`
# we build unifies with the one blade's SPIR-V backend consumes. This rev
# carries `spv::Options::emit_int_div_checks`, which blade sets to false.
naga = { version = "29.0.0", git = "https://github.com/gfx-rs/wgpu", rev = "cefd48f6cff61d64abe1cdb4002c4e39bfc2c728", default-features = false, features = ["wgsl-in", "wgsl-out", "spv-out"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
log = "0.4"
flate2 = "1"
safetensors = "0.4"
hf-hub = { version = "0.4", default-features = false, features = ["ureq", "rustls-tls"], optional = true }
oxionnx-core = "0.1"
oxionnx-proto = "0.1"
half = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true, features = ["registry"] }

# Only the examples, benches, and tests need these. Keeping them out of
# `[dependencies]` matters for cross-compilation: `tokenizers`/`onig`
# pulls in a C library, which is a needless build-script burden for
# downstream crates that just want the inference runtime.
[dev-dependencies]
env_logger = "0.11"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

